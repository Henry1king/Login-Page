<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="/Sign_Up/style.css">
</head>
<body>
<style>
     *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:url("https://images.unsplash.com/photo-1583759311999-c8821f61e5b0?q=80&w=2620&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
    background-size:cover;
    background-position:center;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.signup-box{

    width:430px;
    padding:40px;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;

    box-shadow:0 8px 30px rgba(0,0,0,.35);
    color:white;
}

.signup-box h2{
    text-align:center;
    font-size:32px;
    margin-bottom:8px;
}

.signup-box p{
    text-align:center;
    margin-bottom:25px;
    color:#eee;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{

    width:100%;
    padding:14px;

    border-radius:10px;
    border:1px solid rgba(255,255,255,.3);

    background:rgba(255,255,255,.15);

    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#ddd;
}

.input-box input:focus{
    outline:none;
    border-color:white;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    margin:18px 0;
}

.checkbox input{
    width:18px;
    height:18px;
}

button{

    width:100%;
    padding:15px;

    border:none;
    border-radius:10px;

    background:#2563eb;
    color:white;

    font-size:17px;
    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.login-link{

    margin-top:25px;
    text-align:center;
}

.login-link a{
    color:#6ea8ff;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}
</style>
<div class="container">
    <div class="signup-box">

        <h2>Create Account</h2>
        <p>Join us today</p>

        <form action="#">

            <div class="input-box">
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="input-box">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <div class="checkbox">
                <input type="checkbox" required>
                <span>I agree to the Terms & Conditions</span>
            </div>

            <button>Create Account</button>

            <p class="login-link">
                Already have an account?
                <a /Sign_In/">Login</a>
            </p>

        </form>

    </div>
</div>

</body>
</html>
